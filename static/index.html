<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语精听训练</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
    <div id="app">
        <!-- 音频列表页 -->
        <div id="list-view">
            <header>
                <h1>英语精听训练</h1>
            </header>
            <section class="upload-section">
                <form id="upload-form">
                    <input type="file" id="file-input" accept="audio/*" required>
                    <button type="submit" id="upload-btn">上传并解析</button>
                </form>
                <div id="upload-status"></div>
            </section>
            <section class="audio-list-section">
                <h2>音频列表</h2>
                <div id="audio-list"></div>
            </section>
        </div>

        <!-- 训练页 -->
        <div id="training-view" style="display:none;">
            <header>
                <button id="back-btn">← 返回</button>
                <h1 id="training-title"></h1>
            </header>
            <audio id="audio-player" controls></audio>
            <div id="sentences-container"></div>
        </div>
    </div>
    <script src="/static/app.js?v=2"></script>
</body>
</html>
